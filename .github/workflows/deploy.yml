name: Deploy to areg.nl/workflow and areg.nl/rpm-boss/workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund --no-audit
      - run: node scripts/build.mjs
      # areg.nl is the GitHub Pages site AregShahbazian.github.io; each build
      # replaces only its own folder there.
      - name: Publish the rpm-boss docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: AregShahbazian/AregShahbazian.github.io
          publish_branch: main
          publish_dir: dist
          destination_dir: rpm-boss/workflow
      # actions-gh-pages binds a fixed ssh-agent socket; free it for the second run.
      - run: pkill ssh-agent; rm -f /tmp/ssh-auth.sock
      - name: Publish the method page
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: AregShahbazian/AregShahbazian.github.io
          publish_branch: main
          publish_dir: dist-narrative
          destination_dir: workflow
